<div id="carousel"></div>

<script>
    const menuData = [
        {
            type: 'normal',
            cat: "HOT",
            name: "Filadélfia",
            desc: "Hot Roll Panko (10 unid.) Enrolados de arroz recheados com cream cheese e cebolinha, empanados em farinha panko para máxima crocância.",
            price: "29,99",
            img: "./hot-filadelfia.jpg",
            duration: 7000
        },
        {
            type: 'normal',
            cat: "HOT",
            name: "Camarão",
            desc: "Hot Roll Panko (10 unid.) Enrolados de arroz recheados com cream cheese e cebolinha, empanados em farinha panko para máxima crocância.",
            price: "29,99",
            img: "./hot-camarao.jpg",
            duration: 7000
        },
        {
            type: 'normal',
            cat: "HOT",
            name: "Skin",
            desc: "Hot Roll Panko (10 unid.) Enrolados de arroz recheados com cream cheese e cebolinha, empanados em farinha panko para máxima crocância.",
            price: "25,99",
            img: "./hot-skin.jpg",
            duration: 7000
        },
        {
            type: 'normal',
            cat: "HOT",
            name: "Chefe",
            desc: "Hot Roll Panko (10 unid.) Enrolados de arroz recheados com cream cheese e cebolinha, empanados em farinha panko para máxima crocância.",
            price: "39,99",
            img: "./hot-chefe.jpg",
            duration: 8000
        },
        {   
            type: "promo", 
            cat: "HOT",
            name: "Combo 50 Peças (Só Love Hot)",
            desc: "20 Hot Filadélfia, 20 Hot Camarão, 10 Hot do Chefe.",
            price: "119,99",
            img: "./hot-so_love_hot.jpg",
            duration: 7000
        },
        {
            type: 'normal',
            cat: "TEMAKI",
            name: "Filadélfia Super Hot",
            desc: "Salmão, cream cheese e cebolinha. Empanado e frito na panko.",
            price: "39,99",
            img: "./temaki-filadelfia_super_hot.jpg",
            duration: 7000
        },
        {
            type: 'normal',
            cat: "HARUMAKI",
            name: "Frango com Requeijão",
            desc: "Rolinho primavera 2 unidades",
            price: "18,99",
            img: "./harumaki-frango_queijo.jpg",
            duration: 7000
        },
        {
            type: 'normal',
            cat: "HARUMAKI",
            name: "Camarão com Cream Cheese e Alho Poró",
            desc: "Rolinho primavera 2 unidades",
            price: "19,99",
            img: "./harumaki-camarao_queijo_alho_poro.jpg",
            duration: 7000
        },
        
        
    ];

    const carousel = document.getElementById('carousel');

    function buildSlides() {
        menuData.forEach((item, index) => {
            const slide = document.createElement('div');
            slide.className = `slide ${index === 0 ? 'active' : ''}`;
            slide.innerHTML = `
                <div class="content-wrap">
                    <div class="item-info">
                        <div class="category">${item.cat}</div>
                        <div class="name">${item.name}</div>
                        <div class="desc">${item.desc}</div>
                        <div class="price"><span>R$</span>${item.price}</div>
                    </div>
                    <div class="item-image">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="hanko">QUALIDADE<br>SUPREMA</div>
                    </div>
                </div>
            `;
            carousel.appendChild(slide);
        });
        runCarousel(0);
    }

    function runCarousel(idx) {
        const slides = document.querySelectorAll('.slide');
        if (slides.length === 0) return;
        
        slides.forEach(s => s.classList.remove('active'));
        slides[idx].classList.add('active');

        const nextIdx = (idx + 1) % menuData.length;
        setTimeout(() => runCarousel(nextIdx), menuData[idx].duration);
    }

    // --- CÓDIGO PARA REFRESH AUTOMÁTICO ---
    const dezMinutos = 2 * 60 * 1000; // 10 min * 60 seg * 1000 ms
    setTimeout(() => {
        window.location.reload();
    }, dezMinutos);
    // --------------------------------------

    window.onload = buildSlides;
</script>
